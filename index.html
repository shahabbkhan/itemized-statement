      <div class="range">
        <div class="label">Statement Period</div>
        <div class="name" style="font-size:.9rem;">${formatDate(fromDate)} &ndash; ${formatDate(toDate)}</div>
      </div>
    </div>
    ${warningHtml}
  `;

  const printHeaderText = `${escapeHtml(partyName)} — ${formatDate(fromDate)} to ${formatDate(toDate)}`;

  let tableHtml = `<div class="table-wrap"><table>
    <thead>
      <tr class="print-header-row">
        <td colspan="5">${printHeaderText}</td>
      </tr>
      <tr>
        <th>Date</th>
        <th>Transaction</th>
        <th class="num">Debit</th>
        <th class="num">Credit</th>
        <th class="num">Balance</th>
      </tr>
    </thead><tbody>`;

  for (const row of displayRows) {
    if (row.type === 'balanceForward') {
      tableHtml += `<tr class="tr-balance-forward">
        <td>${formatDate(fromDate)}</td>
        <td>Balance Forward</td>
        <td class="num"></td>
        <td class="num"></td>
        <td class="num">${formatBalanceWithDrCrFor(row.runningBalance, cur)}</td>
      </tr>`;
    } else if (row.type === 'empty') {
      tableHtml += `<tr class="tr-empty"><td colspan="5">No transactions posted in this period.</td></tr>`;
    } else if (row.type === 'main') {
      const t = row.transaction;
      // Journal Entry: no badge — show description directly (line desc → narration → "Journal Entry").
      // Other types: badge shows displayType (custom title) or type, then description after em-dash.
      let transDesc;
      if (t.type === 'Journal Entry') {
        const jeText = t.displayDescription || 'Journal Entry';
        transDesc = (t.displayRef ? `${t.displayRef} &mdash; ` : '') + escapeHtml(jeText);
      } else {
        const badgeLabel = t.displayType || t.type;
        const badge = `<span class="badge">${escapeHtml(badgeLabel)}</span>`;
        transDesc = badge;
        if (t.displayRef) transDesc += ` ${t.displayRef}`;
        if (t.displayDescription) transDesc += ` &mdash; ${escapeHtml(t.displayDescription)}`;
      }
      const debitStr = t.isDebit ? formatFixed(Math.abs(t.amount), cur.decimals) : '';
      const creditStr = t.isCredit ? formatFixed(Math.abs(t.amount), cur.decimals) : '';
      tableHtml += `<tr class="tr-main">
        <td>${formatDate(t.date)}</td>
        <td>${transDesc}</td>
        <td class="num">${debitStr}</td>
        <td class="num">${creditStr}</td>
        <td class="num">${formatBalanceWithDrCrFor(row.runningBalance, cur)}</td>
      </tr>`;
    } else if (row.type === 'detail') {
      const d = row.detail;
      const total = d.total;
      const absTotal = Math.abs(total);
      const isNegative = total < 0;

      let parts = [];
      let desc = d.description ? escapeHtml(d.description) : '';
      if (isNegative && desc) {
        desc = `Less: ${desc}`;
      } else if (isNegative && !desc) {
        desc = 'Less: Amount';
      }
      if (desc) parts.push(desc);

      if (d.qty !== null && d.qty !== 0) {
        let qtyStr = formatNumberDp(Math.abs(d.qty), cur.decimals);
        if (d.unitName) qtyStr += ` ${d.unitName}`;
        if (d.price > 0) qtyStr += ` @ ${formatMoneyFor(d.price, cur)}`;
        parts.push(qtyStr);
      }
      if (d.discountText) parts.push(d.discountText);

      if (d.taxDisplay) {
        parts.push(`<strong>Amt. excl. Tax=${formatSignedFor(d.baseAmount, cur)}</strong>`);
        parts.push(d.taxDisplay);
        if (isNegative) {
          parts.push(`<strong>${formatMoneyFor(absTotal, cur)}</strong>`);
        } else {
          parts.push(`<strong>Amt. incl. Tax=${formatSignedFor(total, cur)}</strong>`);
        }
      } else {
        if (isNegative) {
          parts.push(`<strong>${formatMoneyFor(absTotal, cur)}</strong>`);
        } else {
          parts.push(`<strong>Amt.=${formatSignedFor(total, cur)}</strong>`);
        }
      }

      const detailText = parts.join(' — ');
      const prefix = row.lineNumber ? `${row.lineNumber}) ` : '';
      tableHtml += `<tr class="tr-detail">
        <td></td>
        <td class="desc">${prefix}${detailText}</td>
        <td class="num"></td>
        <td class="num"></td>
        <td class="num"></td>
      </tr>`;
    } else if (row.type === 'total') {
      tableHtml += `<tr class="tr-total">
        <td></td><td>Period Totals</td>
        <td class="num">${formatFixed(row.debits, cur.decimals)}</td>
        <td class="num">${formatFixed(row.credits, cur.decimals)}</td>
        <td class="num">${formatBalanceWithDrCrFor(row.runningBalance, cur)}</td>
      </tr>`;
    }
  }
  tableHtml += `</tbody></table></div>`;

  const summary = {};
  for (const t of transactions) summary[t.type] = (summary[t.type] || 0) + t.amount;
  for (const key in summary) summary[key] = roundToCurrencyDp(summary[key], cur.decimals);

  const typeLabels = {
    'Invoice': 'Invoices',
    'Purchase Invoice': 'Purchase Invoices',
    'Credit Note': 'Credit Notes',
    'Debit Note': 'Debit Notes',
    'Withholding Tax': 'Withholding Tax',
    'Late Fee': 'Late Payment Fees',
    'Receipt': 'Receipts',
    'Payment': 'Payments',
    'Journal Entry': 'Journal Entries'
  };

  const summaryItems = [`<span class="item"><strong>Opening:</strong> <strong>${formatBalanceWithDrCrFor(openingBalance, cur)}</strong></span>`];
  for (const key of Object.keys(typeLabels)) {
    const val = summary[key];
    if (val && val !== 0) {
      summaryItems.push(`<span class="item"><strong>${typeLabels[key]}:</strong> <strong>${formatBalanceWithDrCrFor(val, cur)}</strong></span>`);
    }
  }
  const summaryHtml = `<div class="summary-line">${summaryItems.join(' ')}</div>`;
  const closingHtml = `<div class="closing-line"><strong>Closing Balance: ${formatBalanceWithDrCrFor(lastBalance, cur)}</strong></div>`;

  return `<div class="statement-page">${headerHtml + tableHtml + summaryHtml + closingHtml}</div>`;
}
// ================================================================
// 11. CSV EXPORT (for single statement only)
// ================================================================
function exportCSV(displayRows, fromDate, toDate, cur) {
  if (!displayRows || displayRows.length === 0) return;
  const headers = ['Date', 'Transaction', 'Debit', 'Credit', 'Balance'];
  const rows = [];
  let pending = null;

  function flush() {
    if (pending) {
      rows.push([pending.date, pending.lines.join('\n'), pending.debit, pending.credit, pending.balance]);
      pending = null;
    }
  }

  for (const row of displayRows) {
    if (row.type === 'balanceForward') {
      flush();
      rows.push([formatDate(fromDate), 'Balance Forward', '', '', formatBalanceWithDrCrFor(row.runningBalance, cur)]);
    } else if (row.type === 'empty') {
      flush();
      rows.push(['', 'No transactions posted in this period.', '', '', '']);
    } else if (row.type === 'main') {
      flush();
      const t = row.transaction;
      let desc = t.displayType || t.type;
      if (t.displayRef) desc += ' ' + t.displayRef;
      if (t.displayDescription) desc += ' - ' + t.displayDescription;
      pending = {
        date: formatDate(t.date),
        lines: [desc],
        debit: t.isDebit ? formatFixed(Math.abs(t.amount), cur.decimals) : '',
        credit: t.isCredit ? formatFixed(Math.abs(t.amount), cur.decimals) : '',
        balance: formatBalanceWithDrCrFor(row.runningBalance, cur)
      };
    } else if (row.type === 'detail') {
      const d = row.detail;
      const parts = [];
      if (d.description) parts.push(d.description);
      if (d.qty !== null && d.qty !== 0) {
        let qtyStr = formatNumberDp(d.qty, cur.decimals);
        if (d.unitName) qtyStr += ` ${d.unitName}`;
        if (d.price > 0) qtyStr += ` @ ${formatMoneyFor(d.price, cur)}`;
        parts.push(qtyStr);
      }
      if (d.discountText) parts.push(d.discountText);
      if (d.taxDisplay) {
        parts.push(`Amt. excl. Tax=${formatSignedFor(d.baseAmount, cur)}`);
        parts.push(d.taxDisplay);
        parts.push(`Amt. incl. Tax=${formatSignedFor(d.total, cur)}`);
      } else {
        parts.push(`Amt.=${formatSignedFor(d.total, cur)}`);
      }
      const prefix = row.lineNumber ? row.lineNumber + ') ' : '';
      if (pending) pending.lines.push(prefix + parts.join(' - '));
    } else if (row.type === 'total') {
      flush();
      rows.push(['', 'Period Totals', formatFixed(row.debits, cur.decimals), formatFixed(row.credits, cur.decimals), formatBalanceWithDrCrFor(row.runningBalance, cur)]);
    }
  }
  flush();

  const csvEscape = (v) => `"${String(v).replace(/"/g, '""')}"`;
  let csv = headers.map(csvEscape).join(',') + '\n' + rows.map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentMode}_statement_${fromDate}_to_${toDate}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ================================================================
// 12. DATE RANGE PRESETS
// ================================================================
function localDateStr(year, month, day) {
  return `${String(year).padStart(4,'0')}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function startOfMonthsAgo(today, monthsBack) {
  let year = today.getFullYear();
  let month = today.getMonth() - (monthsBack - 1);
  while (month < 0) { month += 12; year -= 1; }
  return localDateStr(year, month, 1);
}
function todayStr() {
  const now = new Date();
  return localDateStr(now.getFullYear(), now.getMonth(), now.getDate());
}
function lastDayOfMonth(year, month) {
  // month is 0-based; new Date(year, month+1, 0) gives last day of that month
  const d = new Date(year, month + 1, 0);
  return localDateStr(d.getFullYear(), d.getMonth(), d.getDate());
}
function computePresetRange(preset) {
  const today = new Date();
  const y = today.getFullYear();
  const m = today.getMonth(); // 0-based
  const to = todayStr();
  let from = to;
  let toOverride = null;

  switch (preset) {
    // Current periods — from start of period to today
    case 'this-month':
      from = localDateStr(y, m, 1);
      break;
    case 'this-quarter': {
      const qStart = Math.floor(m / 3) * 3;
      from = localDateStr(y, qStart, 1);
      break;
    }
    case 'this-year':
      from = localDateStr(y, 0, 1);
      break;

    // Last complete periods — full calendar period, both from and to fixed
    case 'last-month': {
      const lm = m === 0 ? 11 : m - 1;
      const ly = m === 0 ? y - 1 : y;
      from = localDateStr(ly, lm, 1);
      toOverride = lastDayOfMonth(ly, lm);
      break;
    }
    case 'last-quarter': {
      const curQ = Math.floor(m / 3);
      const lq = curQ === 0 ? 3 : curQ - 1;
      const lqy = curQ === 0 ? y - 1 : y;
      from = localDateStr(lqy, lq * 3, 1);
      toOverride = lastDayOfMonth(lqy, lq * 3 + 2);
      break;
    }
    case 'last-year':
      from = localDateStr(y - 1, 0, 1);
      toOverride = localDateStr(y - 1, 11, 31);
      break;

    // Rolling — from start of month N months ago to today
    case 'last-3-months':
      from = startOfMonthsAgo(today, 3);
      break;
    case 'last-6-months':
      from = startOfMonthsAgo(today, 6);
      break;
    case 'last-12-months':
      from = startOfMonthsAgo(today, 12);
      break;

    default:
      from = null;
  }
  return { from, to: toOverride || to };
}
function applyPreset(preset) {
  if (preset === 'custom') return;
  if (preset === 'from-start') {
    document.getElementById('toDate').value = todayStr();
    document.getElementById('fromDate').value = todayStr(); // placeholder; overwritten after data loads
    runActiveView();
    return;
  }
  const { from, to } = computePresetRange(preset);
  if (from) {
    document.getElementById('fromDate').value = from;
    document.getElementById('toDate').value = to;
    runActiveView();
  }
}

const CACHE_TTL_MS = 5 * 60 * 1000; // 5 minutes

let referenceDataCache = null;
async function getReferenceData(mode) {
  const now = Date.now();
  if (referenceDataCache && referenceDataCache.mode === mode && (now - referenceDataCache.ts) < CACHE_TTL_MS) return referenceDataCache.data;

  const [inventoryItems, nonInventoryItems, inventoryKits,
    balanceSheetAccounts, profitAndLossAccounts, taxCodes,
    mainControlAccount, controlAccounts, bankAccounts, exchangeRates,
    businessDetails] = await Promise.all([
      getInventoryItems(), getNonInventoryItems(), getInventoryKits(),
      getBalanceSheetAccounts(), getProfitAndLossAccounts(), getTaxCodes(),
      getMainControlAccount(mode), getControlAccountsBatch(mode),
      getBankOrCashAccounts(), getExchangeRates(),
      safeFetch('business details', () => postMessageWithResponse({ type: 'api-request', method: 'GET', path: '/api4/business-details' }), null)
    ]);

  const bankMap = {};
  for (const entry of bankAccounts) {
    const acc = entry.item || entry;
    if (acc.key) {
      bankMap[acc.key] = acc.currency || null;
    }
  }

  const controlAccountKeys = [];
  if (mainControlAccount && mainControlAccount.key) {
    controlAccountKeys.push(mainControlAccount.key);
  }
  const flag = MODES[mode].controlAccountFlag;
  for (const entry of controlAccounts) {
    const ac = entry.item || entry;
    if (ac[flag] === true && ac.key) {
      controlAccountKeys.push(ac.key);
    }
  }
  const uniqueKeys = [...new Set(controlAccountKeys)];

  const rateMap = buildExchangeRateMap(exchangeRates);

  const data = {
    itemMap: buildItemMap(inventoryItems, nonInventoryItems, inventoryKits),
    accountMap: buildAccountMap(balanceSheetAccounts, profitAndLossAccounts),
    taxCodeMap: buildTaxCodeMap(taxCodes),
    controlAccountKeys: uniqueKeys,
    controlDegraded: uniqueKeys.length === 0,
    bankCurrencyMap: bankMap,
    exchangeRateMap: rateMap,
    businessDetails: businessDetails || null
  };
  referenceDataCache = { mode, data, ts: Date.now() };
  return data;
}

let transactionalDataCache = null;
async function getTransactionalData(mode) {
  const now = Date.now();
  if (transactionalDataCache && transactionalDataCache.mode === mode && (now - transactionalDataCache.ts) < CACHE_TTL_MS) return transactionalDataCache.data;

  const [receipts, payments, invoices, creditNotes, journals, fees, allInvoicesForMap] = await Promise.all([
    getReceipts(), getPayments(),
    getInvoices(mode), getCreditNotes(mode),
    getJournalEntries(),
    MODES[mode].includeLateFees ? getLatePaymentFees() : Promise.resolve([]),
    getAllInvoices()
  ]);

  const refs = await getReferenceData(mode);
  const cfg = MODES[mode];
  const headerField = cfg.headerPartyField;
  const linePartyField = cfg.linePartyField;
  const payeeValue = cfg.payeeValue;

  const idx = {
    receipts: indexCashDocsByParty(receipts, refs.controlAccountKeys, linePartyField, payeeValue, headerField),
    payments: indexCashDocsByParty(payments, refs.controlAccountKeys, linePartyField, payeeValue, headerField),
    invoices: indexByTopLevelParty(invoices, headerField),
    creditNotes: indexByTopLevelParty(creditNotes, headerField),
    journals: indexJournalsByParty(journals, linePartyField),
    fees: indexByTopLevelParty(fees, headerField)
  };

  const invoiceMap = buildInvoiceMap(allInvoicesForMap);
  const data = { idx, invoiceMap, refs };
  transactionalDataCache = { mode, data, ts: Date.now() };
  return data;
}

function invalidateAllCaches() {
  referenceDataCache = null;
  transactionalDataCache = null;

let dashboardSort = { col: 'code', dir: 1 };

async function renderDashboardView() {
  const loader = document.getElementById('loader');
  document.getElementById('errorMsg').style.display = 'none';
  const errorDiv = document.getElementById('errorMsg');
  const content = document.getElementById('dashboardContent');
  loader.style.display = 'block';

  try {
    const fromDate = document.getElementById('fromDate').value;
    const toDate = document.getElementById('toDate').value;
    if (!fromDate || !toDate) { showError('Please select both dates.'); loader.style.display = 'none'; return; }

    await fetchDateFormat();
    const mode = currentMode;
    const cfg = MODES[mode];
    const td = await getTransactionalData(mode);
    const refs = td.refs;
    const invoiceMap = td.invoiceMap;
    const bankCurrencyMap = refs.bankCurrencyMap;
    const rateMap = refs.exchangeRateMap;
    exchangeRateMap = rateMap;
    await ensureBaseCurrency();
    const baseCurKey = baseCurrencyInfo.key;
    await ensureBankCurrencies(bankCurrencyMap);
    await ensureCurrencyForParties(allParties.map(p => p.key));

    warnings = { undated: false, controlDegraded: refs.controlDegraded, zeroLineDocs: false, currencyMismatch: false };

    // Build per-party summary rows
    const summaryRows = [];
    const byCurrency = {};

    for (const party of allParties) {
      const cur = currencyFor(party.key);
      const curKey = cur.key || cur.code;
      if (!byCurrency[curKey]) {
        byCurrency[curKey] = { symbol: cur.symbol, code: cur.code, decimals: cur.decimals, invCount: 0, invTotal: 0, cnCount: 0, cnTotal: 0, recvCount: 0, recvTotal: 0, payCount: 0, payTotal: 0, outstandingDr: 0, outstandingCr: 0 };
      }
      const agg = byCurrency[curKey];

      const { allTransactions } = collectAllTransactions(party.key, td.idx, mode, refs, invoiceMap, bankCurrencyMap, baseCurKey);
      const { transactions, openingBalance } = computeRows(allTransactions, fromDate, toDate, cur.decimals);

      let balance = openingBalance;
      const totals = {
        Invoice: 0,
        CreditNote: 0,
        Receipt: 0,
        Payment: 0,
        JournalEntry: 0,
        LateFee: 0,
        WithholdingTax: 0
      };

      for (const t of transactions) {
        const amount = t.amount;
        if (t.type === 'Invoice' || t.type === 'Purchase Invoice') {
          totals.Invoice += amount;
          agg.invCount++;
          agg.invTotal = roundToCurrencyDp(agg.invTotal + Math.abs(amount), cur.decimals);
        } else if (t.type === 'Credit Note' || t.type === 'Debit Note') {
          totals.CreditNote += amount;
          agg.cnCount++;
          agg.cnTotal = roundToCurrencyDp(agg.cnTotal + Math.abs(amount), cur.decimals);
        } else if (t.type === 'Receipt') {
          totals.Receipt += amount;
          agg.recvCount++;
          agg.recvTotal = roundToCurrencyDp(agg.recvTotal + Math.abs(amount), cur.decimals);
        } else if (t.type === 'Payment') {
          totals.Payment += amount;
          agg.payCount++;
          agg.payTotal = roundToCurrencyDp(agg.payTotal + Math.abs(amount), cur.decimals);
        } else if (t.type === 'Journal Entry') {
          totals.JournalEntry += amount;
        } else if (t.type === 'Late Fee') {
          totals.LateFee += amount;
        } else if (t.type === 'Withholding Tax') {
          totals.WithholdingTax += amount;
        }
        balance = roundToCurrencyDp(balance + amount, cur.decimals);
      }

      // Accumulate outstanding totals without rounding (keep raw)
      if (balance > 0) agg.outstandingDr = agg.outstandingDr + balance;
      else if (balance < 0) agg.outstandingCr = agg.outstandingCr + Math.abs(balance);

      if (transactions.length === 0 && openingBalance === 0 && balance === 0) continue;

      summaryRows.push({
        key: party.key,
        code: party.code || '',
        name: party.nameWithCode || party.name || 'Unnamed',
        openingBalance: openingBalance,
        closingBalance: balance,
        totals: totals,
        cur: cur
      });
    }

    // Determine which columns to show (only those with any non-zero total across all rows)
    const typeFields = ['Invoice', 'CreditNote', 'Receipt', 'Payment', 'JournalEntry', 'LateFee', 'WithholdingTax'];
    if (mode === 'supplier') {
      const idx = typeFields.indexOf('LateFee');
      if (idx !== -1) typeFields.splice(idx, 1);
    }
    const activeColumns = typeFields.filter(field => {
      return summaryRows.some(row => row.totals[field] !== 0);
    });

    dashboardRowsCache = summaryRows;
    dashboardByCurrencyCache = byCurrency;
    dashboardCurrentColumns = activeColumns;
    const hideZero = document.getElementById('hideZeroToggle')?.checked;
    const visibleRows = hideZero ? summaryRows.filter(r => r.closingBalance !== 0) : summaryRows;
    renderDashboardBody(content, byCurrency, visibleRows, mode, activeColumns);
  } catch (err) {
    showError(`Error: ${err.message || 'Unknown error'}`);
    console.error(err);
  } finally {
    loader.style.display = 'none';
  }
}

function joinByCurrency(byCurrency, field, countField, separator = ' · ') {
  const parts = [];
  let anyCount = 0;
  for (const key in byCurrency) {
    const agg = byCurrency[key];
    if (countField && agg[countField] === 0) continue;
    anyCount += countField ? agg[countField] : 0;
    const amount = formatNumberDp(agg[field], agg.decimals);
    parts.push(`${agg.code || key} ${amount}`);
  }
  return { text: parts.length ? parts.join(separator) : (countField ? `${agg0Symbol(byCurrency)}0` : '—'), count: anyCount };
}
function agg0Symbol(byCurrency) {
  const first = Object.values(byCurrency)[0];
  return first ? first.symbol : '$';
}

function buildDashboardCardsHtml(byCurrency, mode) {
  const cfg = MODES[mode];
  const inv = joinByCurrency(byCurrency, 'invTotal', 'invCount', '<br>');
  const cn = joinByCurrency(byCurrency, 'cnTotal', 'cnCount', '<br>');
  const recv = joinByCurrency(byCurrency, 'recvTotal', 'recvCount', '<br>');
  const pay = joinByCurrency(byCurrency, 'payTotal', 'payCount', '<br>');
  let primaryTotal, secondaryTotal, primaryLabel, secondaryLabel;
  if (mode === 'customer') {
    primaryTotal = joinByCurrency(byCurrency, 'outstandingDr', null, '<br>');
    secondaryTotal = joinByCurrency(byCurrency, 'outstandingCr', null, '<br>');
    primaryLabel = cfg.outstandingLabel;
    secondaryLabel = cfg.creditLabel;
  } else {
    primaryTotal = joinByCurrency(byCurrency, 'outstandingCr', null, '<br>');
    secondaryTotal = joinByCurrency(byCurrency, 'outstandingDr', null, '<br>');
    primaryLabel = cfg.outstandingLabel;
    secondaryLabel = cfg.creditLabel;
  }

  return `
    <div class="cards">
      <div class="card">
        <div class="card-label">${mode === 'customer' ? 'Invoices' : 'Purchase Invoices'}</div>
        <div class="card-value">${inv.text}</div>
        <div class="card-sub">${inv.count} in period</div>
      </div>
      <div class="card">
        <div class="card-label">${mode === 'customer' ? 'Credit Notes' : 'Debit Notes'}</div>
        <div class="card-value">${cn.text}</div>
        <div class="card-sub">${cn.count} in period</div>
      </div>
      <div class="card">
        <div class="card-label">Receipts</div>
        <div class="card-value">${recv.text}</div>
        <div class="card-sub">${recv.count} in period</div>
      </div>
      <div class="card">
        <div class="card-label">Payments</div>
        <div class="card-value">${pay.text}</div>
        <div class="card-sub">${pay.count} in period</div>
      </div>
      <div class="card">
        <div class="card-label">${primaryLabel}</div>
        <div class="card-value">${primaryTotal.text}</div>
        <div class="card-sub">${secondaryTotal.text !== '—' ? `${secondaryLabel}: ${secondaryTotal.text}` : 'as of ' + formatDate(document.getElementById('toDate').value)}</div>
      </div>
    </div>
  `;
}

function sortDashboardRows(rows, col, dir) {
  return [...rows].sort((a, b) => {
    let av, bv;
    if (col === 'code') { av = a.code || ''; bv = b.code || ''; }
    else if (col === 'name') { av = a.name || ''; bv = b.name || ''; }
    else if (col === 'openingBalance' || col === 'closingBalance') {
      av = a[col];
      bv = b[col];
    } else {
      av = a.totals[col] || 0;
      bv = b.totals[col] || 0;
    }
    if (typeof av === 'number' && typeof bv === 'number') {
      return dir * (av - bv);
    }
    const cmp = String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' });
    if (cmp !== 0) return dir * cmp;
    return String(a.code || '').localeCompare(String(b.code || ''), undefined, { numeric: true }) ||
           String(a.name || '').localeCompare(String(b.name || ''));
  });
}

function buildDashboardTableHtml(rows, mode, activeColumns, batchMode) {
  const sorted = sortDashboardRows(rows, dashboardSort.col, dashboardSort.dir);
  const arrow = (col) => dashboardSort.col === col ? (dashboardSort.dir === 1 ? ' <span class="sort-arrow">&#9650;</span>' : ' <span class="sort-arrow">&#9660;</span>') : '';

  const cfg = MODES[mode];
  const colLabels = {
    Invoice: mode === 'supplier' ? 'Purchase Invoices' : 'Invoices',
    CreditNote: mode === 'supplier' ? 'Debit Notes' : 'Credit Notes',
    Receipt: 'Receipts',
    Payment: 'Payments',
    JournalEntry: 'Journal Entries',
    LateFee: 'Late Fees',
    WithholdingTax: 'Withholding Tax'
  };
  let headerHtml = `<tr>`;
  if (batchMode) {
    headerHtml += `<th><input type="checkbox" id="selectAllCheckbox" /></th>`;
  }
  headerHtml += `
    <th data-sort="code">Code${arrow('code')}</th>
    <th data-sort="name">${cfg.label}${arrow('name')}</th>
    <th data-sort="openingBalance" class="num">Opening${arrow('openingBalance')}</th>`;
  for (const col of activeColumns) {
    const label = colLabels[col] || col;
    headerHtml += `<th data-sort="${col}" class="num">${label}${arrow(col)}</th>`;
  }
  headerHtml += `<th data-sort="closingBalance" class="num">Closing Balance${arrow('closingBalance')}</th></tr>`;

  let bodyHtml = '';
  if (sorted.length === 0) {
    const colSpan = 4 + activeColumns.length + (batchMode ? 1 : 0);
    bodyHtml += `<tr><td colspan="${colSpan}" style="text-align:center;color:var(--muted);padding:20px;">No parties with activity or an outstanding balance in this period.</td></tr>`;
  } else {
    for (const r of sorted) {
      const bal = r.closingBalance;
      let balCls;
      if (mode === 'customer') {
        balCls = bal > 0 ? 'bal-dr' : (bal < 0 ? 'bal-cr' : 'bal-zero');
      } else {
        balCls = bal > 0 ? 'bal-cr' : (bal < 0 ? 'bal-dr' : 'bal-zero');
      }
      let rowHtml = `<tr data-party="${escapeHtml(r.key)}">`;
      if (batchMode) {
        rowHtml += `<td><input type="checkbox" class="party-checkbox" data-party="${escapeHtml(r.key)}" /></td>`;
      }
      rowHtml += `
        <td>${r.code ? `<span class="code-chip">${escapeHtml(r.code)}</span>` : ''}</td>
        <td>${escapeHtml(r.name)}</td>
        <td class="num">${formatBalanceWithDrCrFor(r.openingBalance, r.cur)}</td>`;
      for (const col of activeColumns) {
        const amount = r.totals[col] || 0;
        rowHtml += `<td class="num">${formatBalanceWithDrCrFor(amount, r.cur)}</td>`;
      }
      rowHtml += `<td class="num ${balCls}">${formatBalanceWithDrCrFor(bal, r.cur)}</td></tr>`;
      bodyHtml += rowHtml;
    }
  }

  return `<div class="dash-table-wrap"><table class="dash-table">
    <thead>${headerHtml}</thead>
    <tbody>${bodyHtml}</tbody>
  </table></div>`;
}

function renderDashboardBody(container, byCurrency, rows, mode, activeColumns) {
  const batchMode = document.getElementById('batchModeToggle').checked;
  const cardsHtml = buildDashboardCardsHtml(byCurrency, mode);
  const tableHtml = buildDashboardTableHtml(rows, mode, activeColumns, batchMode);
  container.innerHTML = cardsHtml + tableHtml;

  // Show/hide Generate Selected button
  const generateBtn = document.getElementById('generateBatchBtn');
  generateBtn.style.display = batchMode ? '' : 'none';

  // Set up checkboxes if in batch mode
  const selectAll = document.getElementById('selectAllCheckbox');
  const checkboxes = container.querySelectorAll('.party-checkbox');
  if (selectAll) {
    selectAll.addEventListener('change', function() {
      checkboxes.forEach(cb => cb.checked = this.checked);
    });
    // Ensure select all reflects current state
    selectAll.checked = checkboxes.length > 0 && Array.from(checkboxes).every(c => c.checked);
  }
  checkboxes.forEach(cb => {
    cb.addEventListener('change', function() {
      if (selectAll) {
        selectAll.checked = Array.from(checkboxes).every(c => c.checked);
      }
    });
  });

  // Sorting
  container.querySelectorAll('thead th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      if (dashboardSort.col === col) dashboardSort.dir *= -1;
      else { dashboardSort.col = col; dashboardSort.dir = 1; }
      renderDashboardBody(container, byCurrency, dashboardRowsCache, mode, activeColumns);
    });
  });

  // Row click: if batch mode, toggle checkbox; else open statement
  container.querySelectorAll('tbody tr[data-party]').forEach(tr => {
    tr.addEventListener('click', function(e) {
      if (e.target.type === 'checkbox') return;
      if (batchMode) {
        const cb = this.querySelector('.party-checkbox');
        if (cb) cb.checked = !cb.checked;
        if (selectAll) {
          const allCbs = container.querySelectorAll('.party-checkbox');
          selectAll.checked = Array.from(allCbs).every(c => c.checked);
        }
      } else {
        const partyKey = this.dataset.party;
        if (partyKey) {
          showStatement(partyKey, false);
          generateStatement(partyKey);
        }
      }
    });
  });
}

// ================================================================
// 16. SINGLE & BATCH STATEMENT GENERATION
// ================================================================
let currentGeneration = 0;

async function generateStatement(partyKey) {
  document.getElementById('errorMsg').style.display = 'none';
  const myGeneration = ++currentGeneration;
  let fromDate = document.getElementById('fromDate').value;
  let toDate = document.getElementById('toDate').value;

  if (!partyKey) { showError('Please select a party.'); return; }
  if (!fromDate || !toDate) { showError('Please select both dates.'); return; }

  const btn = document.getElementById('fetchBtn');
  const loader = document.getElementById('loader');
  const errorDiv = document.getElementById('errorMsg');
  const content = document.getElementById('statementContent');

  btn.disabled = true;
  loader.style.display = 'block';
  errorDiv.style.display = 'none';
  content.innerHTML = '';

  try {
    await fetchDateFormat();
    const mode = currentMode;
    const td = await getTransactionalData(mode);
    const refs = td.refs;
    const invoiceMap = td.invoiceMap;
    const bankCurrencyMap = refs.bankCurrencyMap;
    const rateMap = refs.exchangeRateMap;
    exchangeRateMap = rateMap;
    await ensureBaseCurrency();
    const baseCurKey = baseCurrencyInfo.key;
    // Ensure party currency info is fetched
    await ensureCurrencyForParties([partyKey]);
    // Ensure bank account currencies are fetched
    const bankCurUuids = new Set();
    for (const bankKey in bankCurrencyMap) {
      const curKey = bankCurrencyMap[bankKey];
      if (curKey) bankCurUuids.add(curKey);
    }
    const missingBank = [...bankCurUuids].filter(u => !currencyInfoByUuid[u]);
    if (missingBank.length > 0) {
      const fetched = await getForeignCurrenciesByKeys(missingBank);
      for (const it of fetched) {
        const c = it.item || it;
        if (c.key) {
          currencyInfoByUuid[c.key] = {
            symbol: c.prefix || c.displayPrefix || '$',
            decimals: (c.decimalPlaces !== undefined && c.decimalPlaces !== null) ? c.decimalPlaces : 2,
            code: c.code || c.displayCode || 'USD',
            key: c.key
          };
        }
      }
    }

    warnings = { undated: false, controlDegraded: refs.controlDegraded, zeroLineDocs: false, currencyMismatch: false };

    if (myGeneration !== currentGeneration) return;

    const { allTransactions, allDates } = collectAllTransactions(partyKey, td.idx, mode, refs, invoiceMap, bankCurrencyMap, baseCurKey);

    if (document.getElementById('rangePreset').value === 'from-start') {
      const earliest = allDates.length > 0 ? allDates.reduce((a, b) => (a < b ? a : b)) : fromDate;
      fromDate = earliest;
      document.getElementById('fromDate').value = earliest;
    }

    const cur = currencyFor(partyKey);
    const { rows, transactions, openingBalance } = computeRows(allTransactions, fromDate, toDate, cur.decimals);

    if (myGeneration !== currentGeneration) return;

    currentDisplayRows = rows;
    currentRange = { from: fromDate, to: toDate };

    const party = allParties.find(p => p.key === partyKey);
    const html = buildStatementHTML(rows, transactions, openingBalance, party, fromDate, toDate, warnings, mode, refs.businessDetails);
    content.innerHTML = html;

    // Set print title to "Statement - PartyName"
    const partyName = party ? (party.nameWithCode || party.name || '') : '';
    document.title = partyName ? `Statement - ${partyName}` : 'Statement of Account';

    showStatement(partyKey, false);
  } catch (err) {
    if (myGeneration !== currentGeneration) return;
    showError(`Error: ${err.message || 'Unknown error'}`);
    console.error(err);
  } finally {
    if (myGeneration !== currentGeneration) return;
    btn.disabled = false;
    loader.style.display = 'none';
  }
}

async function generateBatchStatements(partyKeys) {
  if (!partyKeys || partyKeys.length === 0) {
    showError('Please select at least one party.');
    return;
  }

  const btn = document.getElementById('generateBatchBtn');
  const loader = document.getElementById('loader');
  const errorDiv = document.getElementById('errorMsg');
  const content = document.getElementById('statementContent');

  btn.disabled = true;
  loader.style.display = 'block';
  errorDiv.style.display = 'none';
  content.innerHTML = '';
  const myBatchGen = ++currentGeneration;

  try {
    await fetchDateFormat();
    const mode = currentMode;
    if (myBatchGen !== currentGeneration) return;
    const td = await getTransactionalData(mode);
    const refs = td.refs;
    const invoiceMap = td.invoiceMap;
    const bankCurrencyMap = refs.bankCurrencyMap;
    const rateMap = refs.exchangeRateMap;
    exchangeRateMap = rateMap;
    await ensureBaseCurrency();
    const baseCurKey = baseCurrencyInfo.key;
    await ensureCurrencyForParties(partyKeys);
    await ensureBankCurrencies(bankCurrencyMap);

    const globalFromDate = document.getElementById('fromDate').value;
    const globalToDate = document.getElementById('toDate').value;
    let fromDate = globalFromDate;
    let toDate = globalToDate;

    let combinedHTML = '';

    for (const partyKey of partyKeys) {
      const party = allParties.find(p => p.key === partyKey);
      if (!party) continue;

      warnings = { undated: false, controlDegraded: refs.controlDegraded, zeroLineDocs: false, currencyMismatch: false };

      const { allTransactions, allDates } = collectAllTransactions(partyKey, td.idx, mode, refs, invoiceMap, bankCurrencyMap, baseCurKey);

      let localFromDate = fromDate;
      if (document.getElementById('rangePreset').value === 'from-start') {
        const earliest = allDates.length > 0 ? allDates.reduce((a, b) => (a < b ? a : b)) : fromDate;
        localFromDate = earliest;
      }

      const cur = currencyFor(partyKey);
      const { rows, transactions, openingBalance } = computeRows(allTransactions, localFromDate, toDate, cur.decimals);

      const html = buildStatementHTML(rows, transactions, openingBalance, party, localFromDate, toDate, warnings, mode, refs.businessDetails);
      combinedHTML += html;
    }

    content.innerHTML = combinedHTML;
    showStatement('', true);
  } catch (err) {
    showError(`Error: ${err.message || 'Unknown error'}`);
    console.error(err);
  } finally {
    btn.disabled = false;
    loader.style.display = 'none';
  }
}

function showError(msg) {
  const errorDiv = document.getElementById('errorMsg');
  errorDiv.textContent = msg;
  errorDiv.style.display = 'block';
}

// ================================================================
// 17. MAIN CONTROLLER / EVENTS
// ================================================================
async function loadParties(mode) {
  try {
    allParties = [];
    const select = document.getElementById('partySelect');
    select.innerHTML = `<option value="">— Loading… —</option>`;
    const items = await getParties(mode);
    allParties = items.map(entry => entry.item || entry).filter(p => p.key);
    select.innerHTML = `<option value="">— All ${MODES[mode].label}s —</option>`;
    const sorted = [...allParties].sort((a, b) =>
      String(a.code || '').localeCompare(String(b.code || ''), undefined, { numeric: true }) ||
      String(a.name || '').localeCompare(String(b.name || ''))
    );
    for (const p of sorted) {
      const opt = document.createElement('option');
      opt.value = p.key;
      opt.textContent = p.nameWithCode || p.name || p.code || 'Unnamed';
      select.appendChild(opt);
    }
  } catch (err) {
    showError(`Failed to load ${MODES[mode].label}s.`);
    console.error(err);
  }
}

async function fetchDateFormat() {
  try {
    const resp = await getDateFormat();
    if (resp && resp.dateFormat) dateFormatStr = resp.dateFormat;
  } catch (e) {
    console.warn('Failed to fetch date format, using default dd/MM/yyyy.', e);
  }
}

// ---- Batch mode toggle ----

  renderDashboardView();
});
document.getElementById('hideZeroToggle').addEventListener('change', function() {
  if (dashboardRowsCache.length > 0) {
    const content = document.getElementById('dashboardContent');
    const mode = currentMode;
    const activeColumns = dashboardCurrentColumns;
    const hideZero = this.checked;
    const visibleRows = hideZero ? dashboardRowsCache.filter(r => r.closingBalance !== 0) : dashboardRowsCache;
    renderDashboardBody(content, dashboardByCurrencyCache, visibleRows, mode, activeColumns);
  }
});

  currentMode = this.value;
  invalidateAllCaches();
  await loadParties(currentMode);
  showDashboard();
  renderDashboardView();
});

// ---- Date presets ----

  applyPreset(this.value);
});
document.getElementById('fromDate').addEventListener('change', () => {
  document.getElementById('rangePreset').value = 'custom';
});
document.getElementById('toDate').addEventListener('change', () => {
  document.getElementById('rangePreset').value = 'custom';
});

// ---- Party dropdown ----
document.getElementById('partySelect').addEventListener('change', function () {

    renderDashboardView();

});

document.getElementById('backToDashboard').addEventListener('click', () => {
  showDashboard();
  renderDashboardView();
});

document.getElementById('fetchBtn').addEventListener('click', () => {
  const selected = document.getElementById('partySelect').value;

// ---- Print & Export ----
document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('printDashboardBtn').addEventListener('click', () => {
  const statementView = document.getElementById('statementView');
  const dashboardView = document.getElementById('dashboardView');
  const controls = document.querySelector('.controls');
  controls.style.display = 'none';
  if (statementView.style.display !== 'none') {
    statementView.style.display = 'none';
    dashboardView.style.display = '';
  }
  window.print();
  setTimeout(() => {
    controls.style.display = '';
    if (activePartyKey && !isBatchMode) {
      statementView.style.display = '';
      dashboardView.style.display = 'none';
    } else if (isBatchMode) {
      statementView.style.display = '';
      dashboardView.style.display = 'none';
    } else {
      statementView.style.display = 'none';
      dashboardView.style.display = '';
    }
  }, 100);
});
document.getElementById('exportBtn').addEventListener('click', () => {
  if (!currentDisplayRows || currentDisplayRows.length === 0 || !activePartyKey) {
    showError('No data to export. Generate a statement first.');
  } else {
    exportCSV(currentDisplayRows, currentRange.from, currentRange.to, currencyFor(activePartyKey));
  }
});

// ---- Refresh ----
document.getElementById('refreshBtn').addEventListener('click', async () => {
  invalidateAllCaches();
  await loadParties(currentMode);
  runActiveView();
});

// ---- Date inputs ----
document.querySelectorAll('input[type="date"]').forEach(el => {
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter') runActiveView(); });
});

// ---- Initial load ----
document.addEventListener('DOMContentLoaded', async () => {
  const { from, to } = computePresetRange('last-3-months');
  document.getElementById('fromDate').value = from;
  document.getElementById('toDate').value = to;
  document.getElementById('rangePreset').value = 'last-3-months';

  currentMode = document.getElementById('modeSelect').value;
  await loadParties(currentMode);
  showDashboard();
  renderDashboardView();
});
